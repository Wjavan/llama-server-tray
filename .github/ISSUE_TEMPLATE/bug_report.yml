name: 🐛 Bug Report
description: Report a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: llama.cpp Version
      description: e.g., llama-b5560-bin-win-cuda-12.4
      placeholder: llama-b5560-bin-win-cuda-12.4
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Double-click llama_server_tray.pyw
        2. Right-click tray icon -> Open Server Log
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant snippets from llama_tray.log or llama_server.log
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have installed pystray and pillow
        - label: I have checked the model directory and version folder structure
