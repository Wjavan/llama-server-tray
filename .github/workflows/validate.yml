name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile llama_server_tray.pyw
      - name: Import test
        run: python -c "import importlib.util, sys; spec = importlib.util.spec_from_file_location('llama_server_tray', 'llama_server_tray.pyw'); mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); print('Import OK, main:', hasattr(mod, 'main'))"