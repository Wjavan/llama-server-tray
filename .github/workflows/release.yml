name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconsole --onefile --name llama-server-tray llama_server_tray.pyw
      - name: Generate SHA256 checksum
        run: sha256sum dist/llama-server-tray.exe > dist/llama-server-tray.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-tray-windows
          path: |
            dist/llama-server-tray.exe
            dist/llama-server-tray.exe.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-server-tray-windows
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/llama-server-tray.exe
            dist/llama-server-tray.exe.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
